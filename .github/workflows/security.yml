name: Tests and dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      VENV_PYTHON: ${{ matrix.os == 'windows-latest' && './.venv/Scripts/python.exe' || './.venv/bin/python' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv --without-pip .venv
      - run: python -m pip --python .venv install --require-hashes -r requirements-dev.lock
      - run: ${{ env.VENV_PYTHON }} -m pip check
      - run: ${{ env.VENV_PYTHON }} -m pytest
      - run: ${{ env.VENV_PYTHON }} -m pip_audit --local
