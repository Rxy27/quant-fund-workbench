name: Tests and dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      VENV_PYTHON: ${{ matrix.os == 'windows-latest' && './.venv/Scripts/python.exe' || './.venv/bin/python' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m venv --without-pip .venv
      - run: python -m pip --python .venv install --require-hashes -r requirements-dev.lock
      - run: ${{ env.VENV_PYTHON }} -m pip check
      - run: ${{ env.VENV_PYTHON }} -m pytest
      - run: ${{ env.VENV_PYTHON }} -m pip_audit --local
